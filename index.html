<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create MotorSports FIA</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 17px;
    line-height: 1.5;
    color: #000;
    background: #fff;
  }
  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 100vh;
    border-right: 1px solid #000;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .brand {
    padding: 0 20px 16px;
    font-weight: bold;
    font-size: 18px;
    border-bottom: 1px solid #000;
    margin-bottom: 8px;
  }
  nav .menu { flex: 1; }
  nav button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 10px 20px;
    font: inherit;
    color: #000;
    cursor: pointer;
  }
  nav button:hover { text-decoration: underline; }
  nav button.active { font-weight: bold; text-decoration: underline; }
  .site-link {
    display: block;
    margin: 0 20px;
    padding-top: 16px;
    border-top: 1px solid #000;
    font-weight: bold;
    color: #000;
    text-decoration: underline;
  }
  main {
    margin-left: 250px;
    height: 100vh;
    overflow-y: auto;
    padding: 40px 56px;
  }
  article { max-width: 780px; }
  article h1, article h2, article h3 { font-weight: bold; line-height: 1.3; }
  article h1 { font-size: 24px; text-align: center; margin-top: 0; }
  article h2 { font-size: 19px; margin-top: 28px; }
  article h3 { font-size: 17px; margin-top: 20px; }
  article p, article ul, article ol { margin: 0 0 12px; }
  article ul, article ol { padding-left: 24px; }
  article hr { border: 0; border-top: 1px solid #000; margin: 24px 0; }
  article table { border-collapse: collapse; width: 100%; margin: 12px 0; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid #000; padding: 4px 8px; text-align: left; vertical-align: top; }
  article th { font-weight: bold; }
  article code { font-family: "Courier New", monospace; font-size: 15px; }
  article pre { border: 1px solid #000; padding: 10px; overflow-x: auto; }
  article pre code { font-size: 14px; }
  article blockquote { margin: 12px 0; padding-left: 12px; border-left: 1px solid #000; }
  article a { color: #000; }
  .error { border: 1px solid #000; padding: 14px; }
  @media (max-width: 700px) {
    nav { position: static; width: 100%; height: auto; border-right: 0; border-bottom: 1px solid #000; padding: 0; }
    nav .menu { display: flex; flex-wrap: wrap; }
    .brand { display: none; }
    nav button { display: inline-block; width: auto; border-right: 1px solid #000; }
    .site-link { margin: 0; padding: 10px 20px; border-top: 0; border-left: 1px solid #000; display: inline-block; }
    main { margin-left: 0; height: auto; overflow: visible; padding: 24px 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">Create MotorSports FIA</div>
  <div class="menu">
    <button data-key="tech">Technical Regulations</button>
    <button data-key="sport">Sporting Regulations</button>
  </div>
  <a class="site-link" href="https://discord.gg/uUkKnumqU2" target="_blank" rel="noopener">Discord server &rarr;</a>
</nav>

<main>
  <article id="content"></article>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  const sources = {
    tech:  { file: 'techregs.md' },
    sport: { file: 'sportsregs.md' }
  };

  const content = document.getElementById('content');
  const main = document.querySelector('main');
  const buttons = document.querySelectorAll('nav button');

  async function load(key) {
    buttons.forEach(b => b.classList.toggle('active', b.dataset.key === key));
    content.innerHTML = '';
    try {
      const res = await fetch(sources[key].file, { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      const text = await res.text();
      content.innerHTML = marked.parse(text);
    } catch (e) {
      content.innerHTML =
        '<div class="error"><p>Failed to load the file <b>' + sources[key].file + '</b>.</p>' +
        '<p>Place it next to index.html and open the site through a server, for example: <code>python3 -m http.server</code>.</p></div>';
    }
    main.scrollTop = 0;
  }

  buttons.forEach(b => b.addEventListener('click', () => load(b.dataset.key)));
  load('tech');
</script>
</body>
</html>
